# Verificação de projeto de estudo: não publica nada
name: CI

on:
  push:
    branches: [master, "developer/**"]
  pull_request:
    branches: [master, "developer/**"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    # PostgreSQL de teste, o mesmo banco da produção (Neon); a senha só vale dentro do job
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # O .npmrc tem ignore-scripts=true: falha aqui se o better-sqlite3 deixar de trazer binário pronto (#36)
      - name: Binário pronto do better-sqlite3
        run: node -e "new (require('better-sqlite3'))(':memory:').close()"
      - name: Testes da API no SQLite
        run: npm test
      - name: Testes da API no PostgreSQL
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      # Versões do app conferidas contra o Expo 57 (#35)
      - name: Versões do Expo
        run: npm run check
      - run: npm test
      - run: npx expo export --platform android --output-dir ci-export
  e2e:
    # Fluxo principal no navegador: API com SQLite temporário + web do Vite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
